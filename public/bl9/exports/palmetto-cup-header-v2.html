<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #C41E3A; margin: 0; padding: 0; }
* { border-radius: 0 !important; }
.header-wrap {
  width: 100%;
  margin: 0;
}

/* Top red reminder banner */
.reminder-bar {
  background: #C41E3A;
  text-align: center;
  padding: 10px 20px;
}
.reminder-bar p {
  color: white;
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* Cream content area */
.content-area {
  background: linear-gradient(180deg, #FFFDE8 0%, #FFF8DC 30%, #E8F4E8 70%, #D4E8F0 100%);
  text-align: center;
  padding: 0 20px 6px 20px;
  position: relative;
}

/* FIESTA title */
.fiesta-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 900;
  font-size: 48px;
  color: #C41E3A;
  letter-spacing: 6px;
  text-transform: uppercase;
  text-shadow: 2px 2px 0px rgba(0,0,0,0.08);
  margin-top: 4px;
  line-height: 1;
}

/* Fairway subtitle */
.fairway-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 500;
  font-style: italic;
  font-size: 32px;
  color: #1B8C3A;
  line-height: 1;
  margin-top: 0px;
}

/* Tagline */
.tagline {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 16px;
  color: #1a1a1a;
  opacity: 0.7;
  margin-top: 8px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.4;
}

/* Blue Palmetto Cup banner */
.palmetto-bar {
  background: #1E3A8A;
  text-align: center;
  padding: 8px 20px;
  border-radius: 0;
}
.palmetto-bar .title {
  color: white;
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.palmetto-bar .subtitle {
  color: white;
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Red date banner */
.date-bar {
  background: #C41E3A;
  text-align: center;
  padding: 8px 20px;
  border-radius: 0;
}
.date-bar p {
  color: white;
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 2px;
}
</style>
